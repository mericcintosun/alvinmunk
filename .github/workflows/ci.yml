name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  web-e2e:
    # A fork PR's pull_request run gets neither secrets nor repository vars from GitHub (same
    # restriction, for the same reason) — every CI_* var below would read empty, and the guard
    # step would fail every external contributor's PR forever, through no fault of their own.
    # Skip cleanly instead of failing red: push and same-repo PRs still get the CI vars and run
    # the smoke test as before; a fork PR just skips this job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_RPC_URL: ${{ vars.NEXT_PUBLIC_RPC_URL || 'https://soroban-testnet.stellar.org' }}
      NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
      NEXT_PUBLIC_HORIZON_URL: ${{ vars.NEXT_PUBLIC_HORIZON_URL || 'https://horizon-testnet.stellar.org' }}
      # The smoke test WRITES on-chain (Friendbot wallet, genesis tx, registry.claim handle,
      # vouch), so it runs against a dedicated CI contract set only — never the published
      # contracts in the README table, whose wallets /api/stats counts and
      # scripts/scan-roster.mjs commits forever (#250). No `|| fallback` here on purpose: a
      # missing variable must fail the job, not silently write to production. Setup:
      # docs/CI_CONTRACTS.md.
      NEXT_PUBLIC_REPUTATION_CONTRACT_ID: ${{ vars.CI_REPUTATION_CONTRACT_ID }}
      NEXT_PUBLIC_QUEST_REGISTRY_CONTRACT_ID: ${{ vars.CI_QUEST_REGISTRY_CONTRACT_ID }}
      NEXT_PUBLIC_REWARDS_CONTRACT_ID: ${{ vars.CI_REWARDS_CONTRACT_ID }}
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: ${{ vars.CI_REGISTRY_CONTRACT_ID }}
      NEXT_PUBLIC_GATE_CONTRACT_ID: ${{ vars.CI_GATE_CONTRACT_ID }}
      NEXT_PUBLIC_USDC_SAC_ID: ${{ vars.CI_USDC_SAC_ID }}
      NEXT_PUBLIC_PASSKEY_WALLET_WASM_HASH: ''
      # Same values, read by the guard below (GitHub's `env:` cannot reference another env var).
      CI_REPUTATION_CONTRACT_ID: ${{ vars.CI_REPUTATION_CONTRACT_ID }}
      CI_QUEST_REGISTRY_CONTRACT_ID: ${{ vars.CI_QUEST_REGISTRY_CONTRACT_ID }}
      CI_REWARDS_CONTRACT_ID: ${{ vars.CI_REWARDS_CONTRACT_ID }}
      CI_REGISTRY_CONTRACT_ID: ${{ vars.CI_REGISTRY_CONTRACT_ID }}
      CI_GATE_CONTRACT_ID: ${{ vars.CI_GATE_CONTRACT_ID }}
      CI_USDC_SAC_ID: ${{ vars.CI_USDC_SAC_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # Fail fast (seconds, before any install) when a CI contract id is missing, malformed or
      # points at a contract the README publishes.
      - name: Guard CI contract ids
        run: node scripts/check-ci-contracts.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web e2e:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Offline tests for the repo's deploy/guard scripts (node:test, no deps).
      - run: node --test scripts/*.test.mjs
