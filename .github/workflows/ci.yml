name: CI

on:
  push:
  pull_request:
  schedule:
    # Run security checks weekly on Monday at 9:00 UTC
    - cron: '0 9 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rust setup for cargo-audit
      - uses: dtolnay/rust-toolchain@stable

      # Run cargo-deny (advisories, bans, licenses, sources) against contracts/deny.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: contracts/Cargo.toml

      # Run cargo-audit for RustSec advisories. Unmaintained/yanked warnings don't fail the
      # job (cargo-audit's default); only an actual vulnerability does.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: contracts
        run: cargo audit

      # pnpm audit for npm dependencies
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bare `pnpm audit` would fail today on 2 critical next@14.2.35 advisories that have no
      # 14.x patch (fix tracked in issue #255 — a major-version upgrade, out of this job's
      # scope). scripts/pnpm-audit-gate.mjs suppresses only those two, by GHSA id, with a
      # documented reason in security/pnpm-audit-allowlist.json — any other critical advisory
      # still fails the job. See docs/SECURITY_AUDIT_POLICY.md.
      - name: Run pnpm audit (gated allowlist)
        run: node scripts/pnpm-audit-gate.mjs --prod --level critical

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_RPC_URL: ${{ vars.NEXT_PUBLIC_RPC_URL || 'https://soroban-testnet.stellar.org' }}
      NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
      NEXT_PUBLIC_HORIZON_URL: ${{ vars.NEXT_PUBLIC_HORIZON_URL || 'https://horizon-testnet.stellar.org' }}
      NEXT_PUBLIC_REPUTATION_CONTRACT_ID: ${{ vars.NEXT_PUBLIC_REPUTATION_CONTRACT_ID || 'CDRYXUS55TKGYEM3YUB3YTJWQKSWWQABK6YPQK7SLEPVALWYK4IR7WCL' }}
      NEXT_PUBLIC_QUEST_REGISTRY_CONTRACT_ID: ${{ vars.NEXT_PUBLIC_QUEST_REGISTRY_CONTRACT_ID || 'CBEJVYLWTU6BQDL3RXKWW6CYUISRC4SUIVURCG452CTOIANGY2N7V3WI' }}
      NEXT_PUBLIC_REWARDS_CONTRACT_ID: ${{ vars.NEXT_PUBLIC_REWARDS_CONTRACT_ID || 'CBMO3X3EXKUZAHNAPRSFVBXJJARJD5I5VME5UQ7OSI2OA5Q56UO7TM3G' }}
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: ${{ vars.NEXT_PUBLIC_REGISTRY_CONTRACT_ID || 'CCT5EGFZ33IFLMUU6EBMC6NWRLX5TWJS5FICNJFBG7MU5PTAU6PFMVH4' }}
      NEXT_PUBLIC_PASSKEY_WALLET_WASM_HASH: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web e2e:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
