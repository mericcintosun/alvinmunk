[package]
name = "alvinmunk-rewards"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
alvinmunk-reputation = { path = "../reputation" }
alvinmunk-quest-registry = { path = "../quest_registry" }
ed25519-dalek = "2"
proptest = "1"
